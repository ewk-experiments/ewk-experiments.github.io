<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VS Code Docs — Floor Plan</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #FAFAFA;
  --outline: rgba(0,0,0,0.10);
  --outline-hover: rgba(59, 130, 246, 0.5);
  --fill-hover: rgba(59, 130, 246, 0.04);
  --fill-selected: rgba(59, 130, 246, 0.08);
  --accent: #3B82F6;
  --text: #18181B;
  --text-muted: #71717A;
  --text-dim: #A1A1AA;
  --font-sans: 'Instrument Sans', sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
}

body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  display: grid;
  grid-template-columns: 1fr 360px;
}

/* Left side */
.plan-side {
  display: flex;
  flex-direction: column;
  padding: 32px 40px;
  position: relative;
}

.plan-header {
  display: flex;
  align-items: baseline;
  gap: 16px;
  margin-bottom: 24px;
}

.plan-header h1 {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-dim);
}

/* Breadcrumb */
.breadcrumb {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
}

.breadcrumb span {
  cursor: pointer;
  transition: color 150ms ease;
}

.breadcrumb span:hover { color: var(--accent); }
.breadcrumb span.current { color: var(--text-muted); cursor: default; }
.breadcrumb .sep { cursor: default; opacity: 0.4; }

/* Floor plan area */
.plan-view {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

.plan-frame {
  width: 100%;
  max-width: 680px;
  aspect-ratio: 16 / 10;
  position: relative;
}

/* Zones */
.zone {
  position: absolute;
  border: 1px solid var(--outline);
  cursor: pointer;
  transition: border-color 180ms ease, background 180ms ease;
}

.zone:hover {
  border-color: var(--outline-hover);
  background: var(--fill-hover);
}

.zone.selected {
  border-color: var(--accent);
  background: var(--fill-selected);
}

.zone.drillable::after {
  content: '';
  position: absolute;
  bottom: 6px;
  right: 6px;
  width: 4px;
  height: 4px;
  background: var(--accent);
  opacity: 0;
  transition: opacity 150ms ease;
}

.zone.drillable:hover::after {
  opacity: 0.6;
}

/* Level views */
.level-view {
  position: absolute;
  inset: 0;
  opacity: 0;
  pointer-events: none;
  transition: opacity 250ms ease;
}

.level-view.active {
  opacity: 1;
  pointer-events: all;
}

/* Right panel */
.docs-side {
  border-left: 1px solid var(--outline);
  padding: 32px 28px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

.empty-state {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

.empty-state p {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
  line-height: 2;
  text-align: center;
}

.docs-content {
  display: none;
}

.docs-content.visible {
  display: block;
  animation: fadeIn 200ms ease forwards;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

.docs-label {
  font-family: var(--font-mono);
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-dim);
  margin-bottom: 10px;
}

.docs-title {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 6px;
}

.docs-desc {
  font-size: 13px;
  color: var(--text-muted);
  line-height: 1.6;
  margin-bottom: 24px;
}

.doc-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.doc-item {
  padding: 12px 14px;
  border: 1px solid var(--outline);
  cursor: pointer;
  transition: border-color 150ms ease, background 150ms ease;
}

.doc-item:hover {
  border-color: var(--outline-hover);
  background: var(--fill-hover);
}

.doc-item h3 {
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 2px;
}

.doc-item p {
  font-size: 11px;
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-weight: 300;
}

/* Tooltip */
.tooltip {
  position: fixed;
  background: var(--text);
  color: white;
  padding: 4px 10px;
  font-family: var(--font-mono);
  font-size: 10px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 100ms ease;
  z-index: 1000;
  white-space: nowrap;
}

.tooltip.visible { opacity: 1; }
</style>
</head>

        <div class="zone" data-name="Vision Toggle" style="left:61%; top:32%; width:39%; height:30%;"></div>
        <div class="zone" data-name="Participants" style="left:0; top:64%; width:100%; height:18%;"></div>
        <div class="zone" data-name="Max Tokens" style="left:0; top:83.5%; width:50%; height:16.5%;"></div>
        <div class="zone" data-name="Temperature" style="left:51%; top:83.5%; width:49%; height:16.5%;"></div>
      </div>

    </div>
  </div>
</div>

<!-- Right panel -->
<div class="docs-side">
  <div class="empty-state" id="empty-state">
    <p>Hover to identify<br/>Click to drill deeper</p>
  </div>
  <div class="docs-content" id="docs-content"></div>

<div class="tooltip" id="tooltip"></div>

let currentLevel = 0;
const breadcrumbNames = ['VS Code'];
const tooltip = document.getElementById('tooltip');

function init() {
  bindLevel();
}

function bindLevel() {
  const activeLevel = document.querySelector('.level-view.active');
  if (!activeLevel) return;

  activeLevel.querySelectorAll('.zone').forEach(zone => {
    zone.onmouseenter = (e) => {
      tooltip.textContent = e.target.dataset.name;
      tooltip.classList.add('visible');
      showDocs(e.target.dataset.name);
    };
    zone.onmousemove = (e) => {
      tooltip.style.left = e.clientX + 14 + 'px';
      tooltip.style.top = e.clientY - 26 + 'px';
    };
    zone.onmouseleave = () => {
      tooltip.classList.remove('visible');
    };
    zone.onclick = (e) => {
      const z = e.currentTarget;
      activeLevel.querySelectorAll('.zone.selected').forEach(s => s.classList.remove('selected'));
      z.classList.add('selected');
      showDocs(z.dataset.name);

      if (z.dataset.drills) {
        const depth = parseInt(z.dataset.drills);
        drillTo(depth, z.dataset.name);
      }
    };
  });
}

function drillTo(depth, name) {
  document.querySelectorAll('.level-view').forEach(lv => lv.classList.remove('active'));
  document.getElementById(`level-${depth}`).classList.add('active');
  currentLevel = depth;

  breadcrumbNames.length = depth;
  breadcrumbNames.push(name);
  updateBreadcrumb();
  bindLevel();
  
  // Clear docs on drill
  hideDocs();
}

function navigateTo(depth) {
  document.querySelectorAll('.level-view').forEach(lv => lv.classList.remove('active'));
  document.getElementById(`level-${depth}`).classList.add('active');
  currentLevel = depth;

  breadcrumbNames.length = depth + 1;
  updateBreadcrumb();
  bindLevel();
  hideDocs();
}

function updateBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  bc.innerHTML = breadcrumbNames.map((name, i) => {
    if (i === breadcrumbNames.length - 1) {
      return `<span class="current">${name}</span>`;
    }
    return `<span onclick="navigateTo(${i})">${name}</span><span class="sep">/</span>`;
  }).join('');
}

function showDocs(name) {
  const data = docsData[name];
  if (!data) return;

  document.getElementById('empty-state').style.display = 'none';
  const content = document.getElementById('docs-content');

  content.innerHTML = `
    <div class="docs-label">Documentation</div>
    <div class="docs-title">${name}</div>
    <p class="docs-desc">${data.desc}</p>
    <div class="doc-list">
      ${data.docs.map(d => `
        <div class="doc-item">
          <h3>${d.title}</h3>
          <p>${d.desc}</p>
        </div>
      `).join('')}
    </div>
  `;

  content.classList.remove('visible');
  void content.offsetWidth;
  content.classList.add('visible');
}

function hideDocs() {
  document.getElementById('docs-content').classList.remove('visible');
  document.getElementById('empty-state').style.display = '';
}

init();
</script>
