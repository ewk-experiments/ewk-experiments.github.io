<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VS Code Docs — Floor Plan Navigation</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg: #FCFCFC;
  --outline: #D4D4D8;
  --outline-hover: #3B82F6;
  --fill-active: #3B82F6;
  --fill-hover: rgba(59, 130, 246, 0.08);
  --text: #18181B;
  --text-muted: #71717A;
  --text-dim: #A1A1AA;
  --font-sans: 'Instrument Sans', sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
  --radius: 3px;
  --transition: 180ms cubic-bezier(0.4, 0, 0.2, 1);
}

body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 60px 40px;
  overflow-x: hidden;
}

/* Header */
.header {
  text-align: center;
  margin-bottom: 48px;
  opacity: 0;
  animation: fadeUp 600ms ease forwards;
}

.header h1 {
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 8px;
  font-family: var(--font-mono);
}

.header p {
  font-size: 13px;
  color: var(--text-dim);
  font-family: var(--font-mono);
  font-weight: 300;
}

/* Breadcrumb */
.breadcrumb {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 32px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-dim);
  opacity: 0;
  animation: fadeUp 600ms 100ms ease forwards;
}

.breadcrumb span {
  cursor: pointer;
  transition: color var(--transition);
}

.breadcrumb span:hover {
  color: var(--fill-active);
}

.breadcrumb span.current {
  color: var(--text);
  font-weight: 500;
  cursor: default;
}

.breadcrumb .sep {
  cursor: default;
  user-select: none;
}

/* Main container */
.floor-plan {
  width: 100%;
  max-width: 900px;
  position: relative;
  opacity: 0;
  animation: fadeUp 600ms 200ms ease forwards;
}

/* Level containers */
.level {
  display: none;
  width: 100%;
}

.level.active {
  display: block;
  animation: levelIn 400ms ease forwards;
}

@keyframes levelIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* SVG floor plans */
.floor-svg {
  width: 100%;
  height: auto;
  display: block;
}

.floor-svg .zone {
  fill: transparent;
  stroke: var(--outline);
  stroke-width: 1.5;
  cursor: pointer;
  transition: fill var(--transition), stroke var(--transition);
}

.floor-svg .zone:hover {
  fill: var(--fill-hover);
  stroke: var(--outline-hover);
}

.floor-svg .zone.highlighted {
  fill: var(--fill-active);
  stroke: var(--fill-active);
}

.floor-svg .zone-label {
  font-family: var(--font-mono);
  font-size: 10px;
  fill: var(--text-dim);
  pointer-events: none;
  transition: fill var(--transition);
}

.floor-svg .zone:hover + .zone-label,
.floor-svg .zone:hover ~ .zone-label {
  fill: var(--outline-hover);
}

/* Tooltip */
.tooltip {
  position: fixed;
  background: var(--text);
  color: white;
  padding: 6px 12px;
  border-radius: var(--radius);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 400;
  pointer-events: none;
  opacity: 0;
  transition: opacity 150ms ease;
  z-index: 1000;
  white-space: nowrap;
}

.tooltip.visible {
  opacity: 1;
}

/* Docs panel */
.docs-panel {
  margin-top: 40px;
  padding-top: 32px;
  border-top: 1px solid var(--outline);
  display: none;
}

.docs-panel.visible {
  display: block;
  animation: fadeUp 300ms ease forwards;
}

.docs-panel h2 {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 6px;
}

.docs-panel .docs-desc {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 24px;
  font-family: var(--font-mono);
  font-weight: 300;
  line-height: 1.6;
}

.docs-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 12px;
}

.doc-tile {
  padding: 16px 18px;
  border: 1px solid var(--outline);
  border-radius: var(--radius);
  cursor: pointer;
  transition: all var(--transition);
}

.doc-tile:hover {
  border-color: var(--outline-hover);
  background: var(--fill-hover);
  transform: translateY(-1px);
}

.doc-tile h3 {
  font-size: 14px;
  font-weight: 500;
  margin-bottom: 4px;
}

.doc-tile p {
  font-size: 12px;
  color: var(--text-muted);
  line-height: 1.5;
  font-family: var(--font-mono);
  font-weight: 300;
}

/* Back button */
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-muted);
  cursor: pointer;
  margin-bottom: 24px;
  padding: 6px 0;
  border: none;
  background: none;
  transition: color var(--transition);
}

.back-btn:hover {
  color: var(--fill-active);
}

.back-btn svg {
  width: 14px;
  height: 14px;
}

/* Drill indicator */
.drill-hint {
  position: absolute;
  bottom: -28px;
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
  opacity: 0;
  transition: opacity 300ms ease;
}

.drill-hint.visible {
  opacity: 1;
}
</style>
</head>

};

let currentLevel = 0;
const breadcrumbPath = ['VS Code'];
const tooltip = document.getElementById('tooltip');
const docsPanel = document.getElementById('docs-panel');

// Initialize
function init() {
  document.querySelectorAll('.zone').forEach(zone => {
    zone.addEventListener('mouseenter', showTooltip);
    zone.addEventListener('mousemove', moveTooltip);
    zone.addEventListener('mouseleave', hideTooltip);
    zone.addEventListener('click', handleClick);
  });
}

function showTooltip(e) {
  const name = e.target.dataset.name;
  if (!name) return;
  tooltip.textContent = name + (e.target.dataset.drills ? ' →' : '');
  tooltip.classList.add('visible');
}

function moveTooltip(e) {
  tooltip.style.left = e.clientX + 12 + 'px';
  tooltip.style.top = e.clientY - 32 + 'px';
}

function hideTooltip() {
  tooltip.classList.remove('visible');
}

function handleClick(e) {
  const zone = e.target;
  const name = zone.dataset.name;
  const drillLevel = zone.dataset.drills;

  // Show docs
  showDocs(name);

  // Drill down if available
  if (drillLevel) {
    setTimeout(() => {
      navigateTo(parseInt(drillLevel));
      breadcrumbPath.length = parseInt(drillLevel) + 1;
      breadcrumbPath[parseInt(drillLevel)] = name;
      updateBreadcrumb();
    }, 200);
  }
}

function showDocs(name) {
  const data = docsData[name];
  if (!data) return;

  document.getElementById('docs-title').textContent = name;
  document.getElementById('docs-desc').textContent = data.desc;
  
  const grid = document.getElementById('docs-grid');
  grid.innerHTML = data.docs.map(doc => `
    <div class="doc-tile">
      <h3>${doc.title}</h3>
      <p>${doc.desc}</p>
    </div>
  `).join('');

  docsPanel.classList.add('visible');
}

function navigateTo(level) {
  document.querySelectorAll('.level').forEach(l => l.classList.remove('active'));
  document.getElementById(`level-${level}`).classList.add('active');
  currentLevel = level;
  
  // Update breadcrumb
  breadcrumbPath.length = level + 1;
  if (level === 0) breadcrumbPath[0] = 'VS Code';
  updateBreadcrumb();

  // Hide docs on navigation
  docsPanel.classList.remove('visible');

  // Re-bind events for new level
  setTimeout(() => {
    document.querySelectorAll('.level.active .zone').forEach(zone => {
      zone.removeEventListener('mouseenter', showTooltip);
      zone.removeEventListener('mousemove', moveTooltip);
      zone.removeEventListener('mouseleave', hideTooltip);
      zone.removeEventListener('click', handleClick);
      zone.addEventListener('mouseenter', showTooltip);
      zone.addEventListener('mousemove', moveTooltip);
      zone.addEventListener('mouseleave', hideTooltip);
      zone.addEventListener('click', handleClick);
    });
  }, 50);
}

function updateBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  bc.innerHTML = breadcrumbPath.map((name, i) => {
    if (i === breadcrumbPath.length - 1) {
      return `<span class="current">${name}</span>`;
    }
    return `<span onclick="navigateTo(${i})">${name}</span><span class="sep">/</span>`;
  }).join('');
}

init();
</script>
</body>
</html>
