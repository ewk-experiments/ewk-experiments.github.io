<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VS Code Docs — Floor Plan</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #FAFAFA;
  --outline: rgba(0,0,0,0.12);
  --outline-dim: rgba(0,0,0,0.06);
  --outline-hover: rgba(59, 130, 246, 0.5);
  --fill-hover: rgba(59, 130, 246, 0.04);
  --fill-active: rgba(59, 130, 246, 0.06);
  --accent: #3B82F6;
  --text: #18181B;
  --text-muted: #71717A;
  --text-dim: #A1A1AA;
  --font-sans: 'Instrument Sans', sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
  --speed: 350ms;
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
}

body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  display: grid;
  grid-template-columns: 1fr 340px;
}

.plan-side {
  display: flex;
  flex-direction: column;
  padding: 28px 36px;
}

.top-bar {
  margin-bottom: 20px;
}

.breadcrumb {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
}
.breadcrumb span { cursor: pointer; transition: color 150ms ease; }
.breadcrumb span:hover { color: var(--accent); }
.breadcrumb span.current { color: var(--text-muted); cursor: default; }
.breadcrumb .sep { cursor: default; opacity: 0.3; }

.plan-view {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* The frame uses CSS Grid for animated zone sizing */
.vscode-frame {
  width: 100%;
  max-width: 760px;
  aspect-ratio: 1.55 / 1;
  display: grid;
  border: 1px solid var(--outline);
  overflow: hidden;
  /* Default: VS Code proportions */
  grid-template-columns: 3.5% 20% 1fr 35%;
  grid-template-rows: 5% 1fr 4%;
  transition: grid-template-columns var(--speed) var(--ease), grid-template-rows var(--speed) var(--ease);
}

/* When chat panel is active, expand it */
.vscode-frame.drill-chat {
  grid-template-columns: 3.5% 10% 15% 1fr;
}

/* Grid cells */
.cell {
  border: 1px solid var(--outline);
  position: relative;
  cursor: pointer;
  transition: border-color 200ms ease, background 200ms ease, opacity var(--speed) ease;
  overflow: hidden;
  margin: -0.5px;
}

.cell:hover {
  border-color: var(--outline-hover);
  background: var(--fill-hover);
}

.cell.active {
  border-color: var(--accent);
  background: var(--fill-active);
  cursor: default;
}

.cell.dimmed {
  opacity: 0.4;
  border-color: var(--outline-dim);
}

.cell.dimmed:hover {
  opacity: 0.7;
  border-color: var(--outline);
  background: none;
}

/* Whisper */
.cell .whisper {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--text-dim);
  opacity: 0.08;
  pointer-events: none;
  transition: opacity 200ms ease;
}
.cell:hover .whisper { opacity: 0.3; }
.cell.dimmed .whisper { opacity: 0.04; }

/* Activity bar */
.cell-activitybar { grid-row: 1 / 3; grid-column: 1; }
/* Sidebar */
.cell-sidebar { grid-row: 1 / 3; grid-column: 2; }
/* Editor */
.cell-editor { grid-row: 1 / 3; grid-column: 3; }
/* Chat panel */
.cell-chat { grid-row: 1 / 3; grid-column: 4; }
/* Status bar */
.cell-status { grid-row: 3; grid-column: 1 / -1; }

/* --- Chat Panel Internal Grid --- */
.chat-grid {
  display: none;
  position: absolute;
  inset: 0;
  grid-template-columns: 1fr;
  grid-template-rows: 7% 1fr 28%;
  transition: grid-template-rows var(--speed) var(--ease);
}

.cell-chat.active .chat-grid {
  display: grid;
}

.chat-grid.drill-input {
  grid-template-rows: 5% 20% 1fr;
}

.chat-cell {
  border: 1px solid var(--outline);
  position: relative;
  cursor: pointer;
  margin: -0.5px;
  transition: border-color 200ms ease, background 200ms ease, opacity var(--speed) ease;
  overflow: hidden;
}
.chat-cell:hover { border-color: var(--outline-hover); background: var(--fill-hover); }
.chat-cell.active { border-color: var(--accent); background: var(--fill-active); cursor: default; }
.chat-cell.dimmed { opacity: 0.4; border-color: var(--outline-dim); }
.chat-cell.dimmed:hover { opacity: 0.7; border-color: var(--outline); background: none; }

.chat-cell .whisper {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--text-dim);
  opacity: 0.08;
  pointer-events: none;
  transition: opacity 200ms ease;
}
.chat-cell:hover .whisper { opacity: 0.3; }

/* --- Agent Input Internal Grid --- */
.input-grid {
  display: none;
  position: absolute;
  inset: 0;
  grid-template-columns: 1fr;
  grid-template-rows: 50% 1fr 14%;
  gap: 0;
}

.chat-cell.cell-input.active .input-grid {
  display: grid;
}

.input-row {
  display: grid;
  border: 1px solid var(--outline);
  margin: -0.5px;
  overflow: hidden;
}

.input-row-msg {
  grid-template-columns: 1fr;
}

.input-row-toolbar {
  grid-template-columns: 1fr 1fr 1fr 0.6fr 0.5fr;
}

.input-row-bottom {
  grid-template-columns: 1.5fr 1fr;
}

.input-cell {
  border: 1px solid var(--outline);
  position: relative;
  cursor: pointer;
  margin: -0.5px;
  transition: border-color 200ms ease, background 200ms ease;
  overflow: hidden;
  min-height: 0;
}
.input-cell:hover { border-color: var(--outline-hover); background: var(--fill-hover); }

.input-cell .whisper {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 8px;
  color: var(--text-dim);
  opacity: 0.06;
  pointer-events: none;
  transition: opacity 200ms ease;
}
.input-cell:hover .whisper { opacity: 0.35; }

/* Right panel */
.docs-side {
  border-left: 1px solid var(--outline);
  padding: 28px 24px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

.empty-state {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}
.empty-state p {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
  line-height: 2.2;
  text-align: center;
}

.docs-content { display: none; }
.docs-content.visible {
  display: block;
  animation: fadeIn 180ms ease forwards;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

.docs-label {
  font-family: var(--font-mono);
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-dim);
  margin-bottom: 10px;
}
.docs-title { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
.docs-desc { font-size: 13px; color: var(--text-muted); line-height: 1.6; margin-bottom: 20px; }

.doc-list { display: flex; flex-direction: column; gap: 6px; }
.doc-item {
  padding: 11px 13px;
  border: 1px solid var(--outline);
  cursor: pointer;
  transition: border-color 150ms ease, background 150ms ease;
}
.doc-item:hover { border-color: var(--outline-hover); background: var(--fill-hover); }
.doc-item h3 { font-size: 13px; font-weight: 500; margin-bottom: 2px; }
.doc-item p { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); font-weight: 300; }

.tooltip {
  position: fixed;
  background: var(--text);
  color: white;
  padding: 4px 10px;
  font-family: var(--font-mono);
  font-size: 10px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 100ms ease;
  z-index: 1000;
  white-space: nowrap;
}
.tooltip.visible { opacity: 1; }
</style>
</head>
<body>

<div class="plan-side">
  <div class="top-bar">
    <div class="breadcrumb" id="breadcrumb">
      <span class="current">VS Code</span>
    </div>
  </div>
  <div class="plan-view">
    <div class="vscode-frame" id="vscode-frame">
      <!-- Activity Bar -->
      <div class="cell cell-activitybar" data-name="Activity Bar" id="cell-activitybar">
        <span class="whisper">Activity Bar</span>
      </div>
      <!-- Sidebar -->
      <div class="cell cell-sidebar" data-name="Primary Sidebar" id="cell-sidebar">
        <span class="whisper">Sidebar</span>
      </div>
      <!-- Editor -->
      <div class="cell cell-editor" data-name="Editor" id="cell-editor">
        <span class="whisper">Editor</span>
      </div>
      <!-- Chat Panel -->
      <div class="cell cell-chat" data-name="Chat Panel" data-drillable="true" id="cell-chat">
        <span class="whisper">Chat Panel</span>
        <!-- Chat internals -->
        <div class="chat-grid" id="chat-grid">
          <div class="chat-cell cell-header" data-name="Chat Header">
            <span class="whisper">Header</span>
          </div>
          <div class="chat-cell cell-conversation" data-name="Conversation Area">
            <span class="whisper">Conversation</span>
          </div>
          <div class="chat-cell cell-input" data-name="Agent Input" data-drillable="true" id="cell-input">
            <span class="whisper">Agent Input</span>
            <!-- Input internals -->
            <div class="input-grid" id="input-grid">
              <div class="input-row input-row-msg">
                <div class="input-cell" data-name="Message Input">
                  <span class="whisper">Message Input</span>
                </div>
              </div>
              <div class="input-row input-row-toolbar">
                <div class="input-cell" data-name="Agent Mode">
                  <span class="whisper">Mode</span>
                </div>
                <div class="input-cell" data-name="Model Picker">
                  <span class="whisper">Model</span>
                </div>
                <div class="input-cell" data-name="Attach Context">
                  <span class="whisper">Attach</span>
                </div>
                <div class="input-cell" data-name="Tools">
                  <span class="whisper">Tools</span>
                </div>
                <div class="input-cell" data-name="Send">
                  <span class="whisper">Send</span>
                </div>
              </div>
              <div class="input-row input-row-bottom">
                <div class="input-cell" data-name="Context Chips">
                  <span class="whisper">Context</span>
                </div>
                <div class="input-cell" data-name="Instructions">
                  <span class="whisper">Instructions</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- Status Bar -->
      <div class="cell cell-status" data-name="Status Bar" id="cell-status">
        <span class="whisper">Status Bar</span>
      </div>
    </div>
  </div>
</div>

<div class="docs-side">
  <div class="empty-state" id="empty-state">
    <p>Hover to identify<br/>Click to explore</p>
  </div>
  <div class="docs-content" id="docs-content"></div>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
const docsData = {
  'Activity Bar': { desc: 'Vertical icon strip for switching between views.', docs: [{ title: 'Customizing the Activity Bar', desc: 'Reorder, hide, or add icons' }, { title: 'View Containers', desc: 'How extensions register views' }, { title: 'Badges & Indicators', desc: 'Notification counts and status' }] },
  'Primary Sidebar': { desc: 'Explorer, Search, Source Control, and extension panels.', docs: [{ title: 'Explorer', desc: 'File tree, open editors, workspace' }, { title: 'Search & Replace', desc: 'Full-text search across workspace' }, { title: 'Source Control', desc: 'Git integration and branch management' }, { title: 'Extensions Panel', desc: 'Browse, install, manage extensions' }] },
  'Editor': { desc: 'Central code editing area with tabs, split views, and diff.', docs: [{ title: 'Basic Editing', desc: 'Multi-cursor, snippets, folding' }, { title: 'IntelliSense', desc: 'Completions, parameter info, quick info' }, { title: 'Debugging', desc: 'Breakpoints, watch, call stacks' }, { title: 'Editor Groups', desc: 'Split editing and grid layout' }] },
  'Status Bar': { desc: 'Bottom bar showing branch, errors, encoding, quick actions.', docs: [{ title: 'Status Bar Items', desc: 'Indicators and quick actions' }, { title: 'Extension Contributions', desc: 'How extensions add items' }] },
  'Chat Panel': { desc: 'Secondary side panel for AI chat and agent interactions.', docs: [{ title: 'Copilot Chat Overview', desc: 'Getting started with AI chat' }, { title: 'Chat Participants', desc: '@workspace, @terminal, extensions' }, { title: 'Chat History', desc: 'Managing sessions and context' }, { title: 'Panel Configuration', desc: 'Position, size, layout' }] },
  'Chat Header': { desc: 'Tabs for conversations and panel actions.', docs: [{ title: 'Chat Tabs', desc: 'Multiple simultaneous conversations' }, { title: 'Chat Actions', desc: 'New chat, history, options' }] },
  'Conversation Area': { desc: 'Scrollable thread displaying the AI conversation.', docs: [{ title: 'Response Rendering', desc: 'Markdown, code blocks, interactive elements' }, { title: 'Code Actions', desc: 'Apply, copy, insert, diff from responses' }, { title: 'Follow-ups', desc: 'Multi-turn context continuation' }] },
  'Agent Input': { desc: 'Compose prompts, select modes, attach context, configure tools.', docs: [{ title: 'Prompt Crafting', desc: 'Writing effective prompts' }, { title: 'Agent Modes', desc: 'Ask vs Agent vs Edit' }, { title: 'Model Selection', desc: 'Choosing between AI models' }, { title: 'Context Attachment', desc: 'Files, selections, references' }] },
  'Message Input': { desc: 'Multi-line text area for composing prompts.', docs: [{ title: 'Multi-line Input', desc: 'Shift+Enter, formatting support' }, { title: 'Slash Commands', desc: '/fix, /explain, /tests' }, { title: 'Variables', desc: '#file, #selection, #editor references' }] },
  'Agent Mode': { desc: 'Switch between Ask, Agent, and Edit interaction modes.', docs: [{ title: 'Ask Mode', desc: 'Q&A without file modification' }, { title: 'Agent Mode', desc: 'Autonomous multi-step with tools' }, { title: 'Edit Mode', desc: 'Inline changes with diff preview' }] },
  'Model Picker': { desc: 'Select which AI model processes your request.', docs: [{ title: 'Available Models', desc: 'GPT-4o, Claude, Gemini, and more' }, { title: 'Capabilities', desc: 'Vision, context window, speed' }, { title: 'Custom Models', desc: 'Configuring additional endpoints' }] },
  'Attach Context': { desc: 'Add files, folders, URLs, or selections as context.', docs: [{ title: 'File Attachment', desc: 'Adding specific files' }, { title: 'Folder Context', desc: 'Including directories' }, { title: 'URL References', desc: 'Fetching web content' }] },
  'Tools': { desc: 'Configure which tools the agent can use.', docs: [{ title: 'Built-in Tools', desc: 'File editing, terminal, search, browser' }, { title: 'Extension Tools', desc: 'Third-party tool providers' }, { title: 'Permissions', desc: 'Auto-approve vs manual confirm' }] },
  'Send': { desc: 'Submit your prompt to the selected model.', docs: [{ title: 'Keyboard Shortcuts', desc: 'Enter to send, Shift+Enter for newline' }, { title: 'Cancel & Regenerate', desc: 'Stop and retry responses' }] },
  'Context Chips': { desc: 'Visual indicators of attached context items.', docs: [{ title: 'Managing Context', desc: 'Add, remove, preview items' }, { title: 'Implicit Context', desc: 'Auto-attached from active editor' }] },
  'Instructions': { desc: 'Custom system instructions that shape AI behavior.', docs: [{ title: 'Custom Instructions', desc: 'Persistent behavior guidelines' }, { title: 'copilot-instructions.md', desc: 'Project-level instructions' }] },
};

const tooltip = document.getElementById('tooltip');
const frame = document.getElementById('vscode-frame');
const chatGrid = document.getElementById('chat-grid');
let drillState = { level: 0 }; // 0=top, 1=chat, 2=input

function init() {
  // Top-level cells
  document.querySelectorAll('.cell').forEach(cell => {
    cell.addEventListener('mouseenter', onEnter);
    cell.addEventListener('mousemove', onMove);
    cell.addEventListener('mouseleave', onLeave);
    cell.addEventListener('click', onCellClick);
  });

  // Chat-level cells
  document.querySelectorAll('.chat-cell').forEach(cell => {
    cell.addEventListener('mouseenter', onEnter);
    cell.addEventListener('mousemove', onMove);
    cell.addEventListener('mouseleave', onLeave);
    cell.addEventListener('click', onChatCellClick);
  });

  // Input-level cells
  document.querySelectorAll('.input-cell').forEach(cell => {
    cell.addEventListener('mouseenter', onEnter);
    cell.addEventListener('mousemove', onMove);
    cell.addEventListener('mouseleave', onLeave);
    cell.addEventListener('click', (e) => { e.stopPropagation(); showDocs(cell.dataset.name); });
  });
}

function onEnter(e) {
  e.stopPropagation();
  const name = e.currentTarget.dataset.name;
  if (!name) return;
  tooltip.textContent = name;
  tooltip.classList.add('visible');
  showDocs(name);
}

function onMove(e) {
  tooltip.style.left = e.clientX + 14 + 'px';
  tooltip.style.top = e.clientY - 26 + 'px';
}

function onLeave() {
  tooltip.classList.remove('visible');
}

function onCellClick(e) {
  e.stopPropagation();
  const cell = e.currentTarget;
  const name = cell.dataset.name;

  if (cell.dataset.drillable === 'true' && !cell.classList.contains('active')) {
    // Drill into chat panel
    drillChat();
  } else if (cell.classList.contains('active')) {
    // Click active = collapse
    collapseToTop();
  } else {
    showDocs(name);
  }
}

function onChatCellClick(e) {
  e.stopPropagation();
  const cell = e.currentTarget;
  const name = cell.dataset.name;

  if (cell.dataset.drillable === 'true' && !cell.classList.contains('active')) {
    drillInput();
  } else if (cell.classList.contains('active')) {
    collapseToChat();
  } else {
    showDocs(name);
  }
}

function drillChat() {
  drillState.level = 1;
  
  // Expand chat column
  frame.classList.add('drill-chat');
  
  // Dim siblings
  document.getElementById('cell-activitybar').classList.add('dimmed');
  document.getElementById('cell-sidebar').classList.add('dimmed');
  document.getElementById('cell-editor').classList.add('dimmed');
  document.getElementById('cell-status').classList.add('dimmed');
  
  // Activate chat
  const chat = document.getElementById('cell-chat');
  chat.classList.add('active');
  
  updateBreadcrumb();
}

function drillInput() {
  drillState.level = 2;
  
  // Expand input row
  chatGrid.classList.add('drill-input');
  
  // Dim siblings
  document.querySelector('.cell-header').classList.add('dimmed');
  document.querySelector('.cell-conversation').classList.add('dimmed');
  
  // Activate input
  document.getElementById('cell-input').classList.add('active');
  
  updateBreadcrumb();
}

function collapseToChat() {
  drillState.level = 1;
  
  chatGrid.classList.remove('drill-input');
  document.querySelector('.cell-header').classList.remove('dimmed');
  document.querySelector('.cell-conversation').classList.remove('dimmed');
  document.getElementById('cell-input').classList.remove('active');
  
  updateBreadcrumb();
  hideDocs();
}

function collapseToTop() {
  drillState.level = 0;
  
  frame.classList.remove('drill-chat');
  chatGrid.classList.remove('drill-input');
  
  document.getElementById('cell-activitybar').classList.remove('dimmed');
  document.getElementById('cell-sidebar').classList.remove('dimmed');
  document.getElementById('cell-editor').classList.remove('dimmed');
  document.getElementById('cell-status').classList.remove('dimmed');
  
  document.getElementById('cell-chat').classList.remove('active');
  document.getElementById('cell-input').classList.remove('active');
  document.querySelector('.cell-header').classList.remove('dimmed');
  document.querySelector('.cell-conversation').classList.remove('dimmed');
  
  updateBreadcrumb();
  hideDocs();
}

function navigateTo(level) {
  if (level === 0) collapseToTop();
  else if (level === 1) collapseToChat();
}

function updateBreadcrumb() {
  const names = ['VS Code'];
  if (drillState.level >= 1) names.push('Chat Panel');
  if (drillState.level >= 2) names.push('Agent Input');
  
  const bc = document.getElementById('breadcrumb');
  bc.innerHTML = names.map((name, i) => {
    if (i === names.length - 1) return `<span class="current">${name}</span>`;
    return `<span onclick="navigateTo(${i})">${name}</span><span class="sep">/</span>`;
  }).join('');
}

function showDocs(name) {
  const data = docsData[name];
  if (!data) return;
  document.getElementById('empty-state').style.display = 'none';
  const content = document.getElementById('docs-content');
  content.innerHTML = `
    <div class="docs-label">Documentation</div>
    <div class="docs-title">${name}</div>
    <p class="docs-desc">${data.desc}</p>
    <div class="doc-list">
      ${data.docs.map(d => `<div class="doc-item"><h3>${d.title}</h3><p>${d.desc}</p></div>`).join('')}
    </div>
  `;
  content.classList.remove('visible');
  void content.offsetWidth;
  content.classList.add('visible');
}

function hideDocs() {
  document.getElementById('docs-content').classList.remove('visible');
  document.getElementById('empty-state').style.display = '';
}

init();
</script>
</body>
</html>
