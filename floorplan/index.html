<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VS Code Docs — Floor Plan</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg: #FAFAFA;
  --outline: rgba(0,0,0,0.12);
  --outline-hover: rgba(59, 130, 246, 0.6);
  --fill-active: rgba(59, 130, 246, 0.1);
  --fill-hover: rgba(59, 130, 246, 0.04);
  --accent: #3B82F6;
  --text: #18181B;
  --text-muted: #71717A;
  --text-dim: #A1A1AA;
  --font-sans: 'Instrument Sans', sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
}

body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  display: grid;
  grid-template-columns: 1fr 380px;
}

/* Left: Floor Plan */
.plan-side {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px;
  position: relative;
}

.plan-header {
  position: absolute;
  top: 32px;
  left: 40px;
}

.plan-header h1 {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-dim);
}

/* Breadcrumb */
.breadcrumb {
  position: absolute;
  top: 56px;
  left: 40px;
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
}

.breadcrumb span {
  cursor: pointer;
  transition: color 150ms ease;
}

.breadcrumb span:hover { color: var(--accent); }
.breadcrumb span.current { color: var(--text); cursor: default; }
.breadcrumb .sep { cursor: default; }

/* Axonometric container */
.axon-container {
  position: relative;
  width: 600px;
  height: 500px;
  perspective: 1200px;
}

.axon-layer {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  transition: transform 500ms cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 400ms ease;
  transform-style: preserve-3d;
}

/* Exploded axonometric offsets */
.axon-layer[data-depth="0"] {
  transform: rotateX(12deg) rotateY(-8deg) rotateZ(2deg) translateZ(0px);
}

.axon-layer[data-depth="1"] {
  transform: rotateX(12deg) rotateY(-8deg) rotateZ(2deg) translateZ(60px) translateX(10px) translateY(-10px);
}

.axon-layer[data-depth="2"] {
  transform: rotateX(12deg) rotateY(-8deg) rotateZ(2deg) translateZ(120px) translateX(20px) translateY(-20px);
}

.axon-layer[data-depth="3"] {
  transform: rotateX(12deg) rotateY(-8deg) rotateZ(2deg) translateZ(180px) translateX(30px) translateY(-30px);
}

.axon-layer.hidden {
  opacity: 0.15;
  pointer-events: none;
}

.axon-layer.inactive {
  opacity: 0.35;
  pointer-events: none;
}

/* SVG styles */
.floor-svg {
  width: 100%;
  height: 100%;
  position: absolute;
  top: 0;
  left: 0;
}

.zone {
  fill: transparent;
  stroke: var(--outline);
  stroke-width: 0.75;
  cursor: pointer;
  transition: fill 150ms ease, stroke 150ms ease;
}

.zone:hover {
  fill: var(--fill-hover);
  stroke: var(--outline-hover);
}

.zone.selected {
  fill: var(--fill-active);
  stroke: var(--accent);
  stroke-width: 1;
}

.zone-label {
  font-family: var(--font-mono);
  font-size: 9px;
  fill: var(--text-dim);
  pointer-events: none;
  transition: fill 150ms ease;
}

.zone:hover ~ .zone-label,
.zone.selected ~ .zone-label {
  fill: var(--accent);
}

.zone-static {
  fill: none;
  stroke: var(--outline);
  stroke-width: 0.5;
  stroke-dasharray: 2 2;
  pointer-events: none;
}

/* Right: Docs panel */
.docs-side {
  border-left: 1px solid var(--outline);
  padding: 40px 32px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

.docs-side .empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  text-align: center;
}

.docs-side .empty-state p {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-dim);
  line-height: 1.8;
}

.docs-content {
  display: none;
  animation: fadeIn 250ms ease forwards;
}

.docs-content.visible {
  display: block;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.docs-section {
  margin-bottom: 32px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--outline);
}

.docs-section:last-child {
  border-bottom: none;
}

.docs-section .section-label {
  font-family: var(--font-mono);
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-dim);
  margin-bottom: 8px;
}

.docs-section h2 {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 6px;
}

.docs-section .desc {
  font-size: 13px;
  color: var(--text-muted);
  line-height: 1.6;
  margin-bottom: 16px;
}

.doc-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.doc-item {
  padding: 12px 14px;
  border: 1px solid var(--outline);
  cursor: pointer;
  transition: all 150ms ease;
}

.doc-item:hover {
  border-color: var(--outline-hover);
  background: var(--fill-hover);
}

.doc-item h3 {
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 2px;
}

.doc-item p {
  font-size: 11px;
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-weight: 300;
}

/* Layer indicator */
.layer-stack {
  position: absolute;
  bottom: 32px;
  left: 40px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.layer-dot {
  width: 20px;
  height: 3px;
  background: var(--outline);
  transition: background 200ms ease, width 200ms ease;
}

.layer-dot.active {
  background: var(--accent);
  width: 28px;
}

/* Tooltip */
.tooltip {
  position: fixed;
  background: var(--text);
  color: white;
  padding: 4px 10px;
  font-family: var(--font-mono);
  font-size: 10px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 120ms ease;
  z-index: 1000;
  white-space: nowrap;
}

.tooltip.visible { opacity: 1; }
</style>
</head>
<body>

<div class="plan-side">
  <div class="plan-header">
    <h1>VS Code Docs</h1>
  </div>
  
  <div class="breadcrumb" id="breadcrumb">
    <span class="current">VS Code</span>
  </div>

  <div class="axon-container" id="axon-container">
    <!-- Layer 0: Full VS Code -->
    <div class="axon-layer" data-depth="0" id="layer-0">
      <svg class="floor-svg" viewBox="0 0 600 400" fill="none">
        <!-- Activity Bar -->
        <rect class="zone" data-name="Activity Bar" x="0" y="0" width="32" height="380"/>
        <text class="zone-label" x="16" y="195" text-anchor="middle" transform="rotate(-90 16 195)">Activity Bar</text>
        
        <!-- Sidebar -->
        <rect class="zone" data-name="Primary Sidebar" x="33" y="0" width="140" height="380"/>
        <text class="zone-label" x="103" y="195" text-anchor="middle">Sidebar</text>
        
        <!-- Editor -->
        <rect class="zone" data-name="Editor" x="174" y="0" width="220" height="380"/>
        <text class="zone-label" x="284" y="195" text-anchor="middle">Editor</text>
        
        <!-- Chat Panel -->
        <rect class="zone" data-name="Chat Panel" data-drills="1" x="395" y="0" width="205" height="380"/>
        <text class="zone-label" x="497" y="188" text-anchor="middle">Chat</text>
        <text class="zone-label" x="497" y="202" text-anchor="middle">Panel</text>
        
        <!-- Status Bar -->
        <rect class="zone" data-name="Status Bar" x="0" y="382" width="600" height="18"/>
        <text class="zone-label" x="300" y="394" text-anchor="middle">Status Bar</text>
      </svg>
    </div>

    <!-- Layer 1: Chat Panel -->
    <div class="axon-layer hidden" data-depth="1" id="layer-1">
      <svg class="floor-svg" viewBox="0 0 600 400" fill="none">
        <!-- Scoped to chat panel area -->
        <!-- Header -->
        <rect class="zone" data-name="Chat Header" x="395" y="0" width="205" height="32"/>
        <text class="zone-label" x="497" y="20" text-anchor="middle">Header</text>
        
        <!-- Conversation -->
        <rect class="zone" data-name="Conversation Area" x="395" y="33" width="205" height="260"/>
        <text class="zone-label" x="497" y="165" text-anchor="middle">Conversation</text>
        
        <!-- Agent Input -->
        <rect class="zone" data-name="Agent Input" data-drills="2" x="395" y="294" width="205" height="86"/>
        <text class="zone-label" x="497" y="340" text-anchor="middle">Agent Input</text>
      </svg>
    </div>

    <!-- Layer 2: Agent Input -->
    <div class="axon-layer hidden" data-depth="2" id="layer-2">
      <svg class="floor-svg" viewBox="0 0 600 400" fill="none">
        <!-- Text input -->
        <rect class="zone" data-name="Message Input" x="395" y="294" width="205" height="44"/>
        <text class="zone-label" x="497" y="320" text-anchor="middle">Message Input</text>
        
        <!-- Bottom toolbar items -->
        <rect class="zone" data-name="Agent Mode" data-drills="3" x="395" y="340" width="52" height="20"/>
        <text class="zone-label" x="421" y="354" text-anchor="middle" font-size="7">Mode</text>
        
        <rect class="zone" data-name="Model Picker" data-drills="3" x="448" y="340" width="52" height="20"/>
        <text class="zone-label" x="474" y="354" text-anchor="middle" font-size="7">Model</text>
        
        <rect class="zone" data-name="Attach Context" x="501" y="340" width="48" height="20"/>
        <text class="zone-label" x="525" y="354" text-anchor="middle" font-size="7">Attach</text>
        
        <rect class="zone" data-name="Tools" x="550" y="340" width="50" height="20"/>
        <text class="zone-label" x="575" y="354" text-anchor="middle" font-size="7">Tools</text>
        
        <!-- Context chips -->
        <rect class="zone" data-name="Context Chips" x="395" y="362" width="120" height="18"/>
        <text class="zone-label" x="455" y="374" text-anchor="middle" font-size="7">Context Chips</text>
        
        <rect class="zone" data-name="Instructions" x="517" y="362" width="83" height="18"/>
        <text class="zone-label" x="558" y="374" text-anchor="middle" font-size="7">Instructions</text>
      </svg>
    </div>

    <!-- Layer 3: Mode / Model detail -->
    <div class="axon-layer hidden" data-depth="3" id="layer-3">
      <svg class="floor-svg" viewBox="0 0 600 400" fill="none">
        <!-- Mode tabs -->
        <rect class="zone" data-name="Ask Mode" x="395" y="340" width="34" height="20"/>
        <text class="zone-label" x="412" y="354" text-anchor="middle" font-size="6">Ask</text>
        
        <rect class="zone" data-name="Agent Mode Detail" x="430" y="340" width="34" height="20"/>
        <text class="zone-label" x="447" y="354" text-anchor="middle" font-size="6">Agent</text>
        
        <rect class="zone" data-name="Edit Mode" x="465" y="340" width="34" height="20"/>
        <text class="zone-label" x="482" y="354" text-anchor="middle" font-size="6">Edit</text>
        
        <!-- Model details -->
        <rect class="zone" data-name="Model Selection" x="395" y="362" width="100" height="18"/>
        <text class="zone-label" x="445" y="374" text-anchor="middle" font-size="7">Model Select</text>
        
        <rect class="zone" data-name="Participants" x="497" y="362" width="103" height="18"/>
        <text class="zone-label" x="548" y="374" text-anchor="middle" font-size="7">Participants</text>
      </svg>
    </div>
  </div>

  <div class="layer-stack" id="layer-stack">
    <div class="layer-dot active" data-layer="0"></div>
    <div class="layer-dot" data-layer="1"></div>
    <div class="layer-dot" data-layer="2"></div>
    <div class="layer-dot" data-layer="3"></div>
  </div>
</div>

<!-- Right panel -->
<div class="docs-side">
  <div class="empty-state" id="empty-state">
    <p>Hover to explore<br/>Click to drill deeper<br/>Docs appear here</p>
  </div>
  <div class="docs-content" id="docs-content"></div>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
const docsData = {
  'Activity Bar': {
    desc: 'The vertical icon strip on the far left for switching between views.',
    docs: [
      { title: 'Customizing the Activity Bar', desc: 'Reorder, hide, or add icons' },
      { title: 'View Containers', desc: 'How extensions register views' },
      { title: 'Badges & Indicators', desc: 'Notification counts and status indicators' }
    ]
  },
  'Primary Sidebar': {
    desc: 'Explorer, Search, Source Control, and extension panels.',
    docs: [
      { title: 'Explorer', desc: 'File tree, open editors, workspace' },
      { title: 'Search & Replace', desc: 'Full-text search across workspace' },
      { title: 'Source Control', desc: 'Git integration and branch management' },
      { title: 'Extensions Panel', desc: 'Browse, install, and manage extensions' }
    ]
  },
  'Editor': {
    desc: 'The central code editing area with tabs, split views, and diff.',
    docs: [
      { title: 'Basic Editing', desc: 'Multi-cursor, snippets, folding' },
      { title: 'IntelliSense', desc: 'Completions, parameter info, quick info' },
      { title: 'Debugging', desc: 'Breakpoints, watch, call stacks' },
      { title: 'Editor Groups', desc: 'Split editing and grid layout' }
    ]
  },
  'Status Bar': {
    desc: 'Bottom bar showing git branch, errors, encoding, and quick actions.',
    docs: [
      { title: 'Status Bar Items', desc: 'Indicators and quick actions' },
      { title: 'Extension Status', desc: 'How extensions contribute items' }
    ]
  },
  'Chat Panel': {
    desc: 'Secondary side panel for AI chat, inline assistance, and agent interactions.',
    docs: [
      { title: 'Copilot Chat Overview', desc: 'Getting started with AI chat' },
      { title: 'Chat Participants', desc: '@workspace, @terminal, and extensions' },
      { title: 'Chat History', desc: 'Managing sessions and context' },
      { title: 'Panel Configuration', desc: 'Position, size, and layout' }
    ]
  },
  'Chat Header': {
    desc: 'Top bar with tabs for multiple conversations and panel actions.',
    docs: [
      { title: 'Chat Tabs', desc: 'Multiple simultaneous conversations' },
      { title: 'Chat Actions', desc: 'New chat, history, options' }
    ]
  },
  'Conversation Area': {
    desc: 'Scrollable area displaying the AI conversation thread.',
    docs: [
      { title: 'Response Rendering', desc: 'Markdown, code blocks, interactive elements' },
      { title: 'Code Actions', desc: 'Apply, copy, insert, diff from responses' },
      { title: 'Follow-ups', desc: 'Multi-turn context continuation' },
      { title: 'Terminal Commands', desc: 'Running suggested commands' }
    ]
  },
  'Agent Input': {
    desc: 'Compose prompts, select modes, attach context, and configure tools.',
    docs: [
      { title: 'Prompt Crafting', desc: 'Writing effective prompts' },
      { title: 'Agent Modes', desc: 'Ask vs Agent vs Edit' },
      { title: 'Model Selection', desc: 'Choosing between AI models' },
      { title: 'Context Attachment', desc: 'Files, selections, references' }
    ]
  },
  'Message Input': {
    desc: 'Multi-line text area for composing prompts.',
    docs: [
      { title: 'Multi-line Input', desc: 'Shift+Enter, formatting' },
      { title: 'Slash Commands', desc: '/fix, /explain, /tests' },
      { title: 'Variables', desc: '#file, #selection, #editor' }
    ]
  },
  'Agent Mode': {
    desc: 'Switch between Ask, Agent, and Edit modes.',
    docs: [
      { title: 'Ask Mode', desc: 'Q&A without file modification' },
      { title: 'Agent Mode', desc: 'Autonomous multi-step with tools' },
      { title: 'Edit Mode', desc: 'Inline changes with diff preview' }
    ]
  },
  'Model Picker': {
    desc: 'Select which AI model processes your request.',
    docs: [
      { title: 'Available Models', desc: 'GPT-4o, Claude, Gemini, and more' },
      { title: 'Capabilities', desc: 'Vision, context window, speed tradeoffs' },
      { title: 'Custom Models', desc: 'Configuring additional endpoints' }
    ]
  },
  'Attach Context': {
    desc: 'Add files, folders, URLs, or selections as prompt context.',
    docs: [
      { title: 'File Attachment', desc: 'Adding specific files' },
      { title: 'Folder Context', desc: 'Including directories' },
      { title: 'URL References', desc: 'Fetching web content' }
    ]
  },
  'Tools': {
    desc: 'Configure which tools the agent can use.',
    docs: [
      { title: 'Built-in Tools', desc: 'File editing, terminal, search, browser' },
      { title: 'Extension Tools', desc: 'Third-party tool providers' },
      { title: 'Permissions', desc: 'Auto-approve vs manual confirm' }
    ]
  },
  'Context Chips': {
    desc: 'Visual indicators of attached context items.',
    docs: [
      { title: 'Managing Context', desc: 'Add, remove, preview items' },
      { title: 'Implicit Context', desc: 'Auto-attached from active editor' }
    ]
  },
  'Instructions': {
    desc: 'Custom system instructions that shape AI behavior.',
    docs: [
      { title: 'Custom Instructions', desc: 'Persistent behavior guidelines' },
      { title: 'copilot-instructions.md', desc: 'Project-level instruction files' }
    ]
  },
  'Ask Mode': {
    desc: 'Q&A mode — AI answers without modifying files.',
    docs: [
      { title: 'When to Use Ask', desc: 'Explanations, debugging, learning' },
      { title: 'Limitations', desc: 'No file edits or terminal access' }
    ]
  },
  'Agent Mode Detail': {
    desc: 'Autonomous mode — AI reads/writes files, runs commands, iterates.',
    docs: [
      { title: 'Capabilities', desc: 'File ops, terminal, multi-step plans' },
      { title: 'Approval Flow', desc: 'Reviewing actions before execution' },
      { title: 'Agent Tools', desc: 'Available tools and configuration' }
    ]
  },
  'Edit Mode': {
    desc: 'Inline editing — targeted code changes with diff preview.',
    docs: [
      { title: 'Edit Workflow', desc: 'Select, describe, review diffs' },
      { title: 'Multi-file Edits', desc: 'Changes across multiple files' }
    ]
  },
  'Model Selection': {
    desc: 'Dropdown for selecting between language models.',
    docs: [
      { title: 'Model Comparison', desc: 'Speed, quality, context tradeoffs' },
      { title: 'Default Model', desc: 'Setting preferred model per mode' },
      { title: 'Bring Your Own Key', desc: 'Custom API endpoints' }
    ]
  },
  'Participants': {
    desc: 'Built-in and extension participants invokable in chat.',
    docs: [
      { title: '@workspace', desc: 'Codebase-aware responses' },
      { title: '@terminal', desc: 'Terminal context and commands' },
      { title: 'Extension Participants', desc: 'Third-party participants' }
    ]
  }
};

let currentDepth = 0;
const breadcrumbPath = ['VS Code'];
const tooltip = document.getElementById('tooltip');

function init() {
  bindZones();
}

function bindZones() {
  document.querySelectorAll('.zone').forEach(zone => {
    zone.addEventListener('mouseenter', onHover);
    zone.addEventListener('mousemove', onMove);
    zone.addEventListener('mouseleave', onLeave);
    zone.addEventListener('click', onClick);
  });
}

function onHover(e) {
  const name = e.target.dataset.name;
  if (!name) return;
  tooltip.textContent = name;
  tooltip.classList.add('visible');
  showDocs(name);
}

function onMove(e) {
  tooltip.style.left = e.clientX + 12 + 'px';
  tooltip.style.top = e.clientY - 28 + 'px';
}

function onLeave() {
  tooltip.classList.remove('visible');
}

function onClick(e) {
  const zone = e.target;
  const name = zone.dataset.name;
  const drillLevel = zone.dataset.drills;

  // Clear previous selections at same layer
  document.querySelectorAll('.zone.selected').forEach(z => z.classList.remove('selected'));
  zone.classList.add('selected');

  showDocs(name);

  if (drillLevel) {
    const depth = parseInt(drillLevel);
    revealLayer(depth);
    breadcrumbPath[depth] = name;
    breadcrumbPath.length = depth + 1;
    updateBreadcrumb();
  }
}

function revealLayer(depth) {
  currentDepth = depth;
  
  for (let i = 0; i <= 3; i++) {
    const layer = document.getElementById(`layer-${i}`);
    if (i < depth) {
      layer.classList.remove('hidden');
      layer.classList.add('inactive');
    } else if (i === depth) {
      layer.classList.remove('hidden', 'inactive');
    } else {
      layer.classList.add('hidden');
      layer.classList.remove('inactive');
    }
  }

  // Update dots
  document.querySelectorAll('.layer-dot').forEach(dot => {
    dot.classList.toggle('active', parseInt(dot.dataset.layer) <= depth);
  });

  setTimeout(bindZones, 50);
}

function navigateTo(depth) {
  currentDepth = depth;
  breadcrumbPath.length = depth + 1;
  updateBreadcrumb();

  for (let i = 0; i <= 3; i++) {
    const layer = document.getElementById(`layer-${i}`);
    if (i < depth) {
      layer.classList.remove('hidden');
      layer.classList.add('inactive');
    } else if (i === depth) {
      layer.classList.remove('hidden', 'inactive');
    } else {
      layer.classList.add('hidden');
      layer.classList.remove('inactive');
    }
  }

  document.querySelectorAll('.layer-dot').forEach(dot => {
    dot.classList.toggle('active', parseInt(dot.dataset.layer) <= depth);
  });

  // Clear docs
  document.getElementById('docs-content').classList.remove('visible');
  document.getElementById('empty-state').style.display = '';
  
  // Clear selections
  document.querySelectorAll('.zone.selected').forEach(z => z.classList.remove('selected'));

  setTimeout(bindZones, 50);
}

function showDocs(name) {
  const data = docsData[name];
  if (!data) return;

  document.getElementById('empty-state').style.display = 'none';
  const content = document.getElementById('docs-content');
  
  content.innerHTML = `
    <div class="docs-section">
      <div class="section-label">Selected Element</div>
      <h2>${name}</h2>
      <p class="desc">${data.desc}</p>
      <div class="doc-list">
        ${data.docs.map(d => `
          <div class="doc-item">
            <h3>${d.title}</h3>
            <p>${d.desc}</p>
          </div>
        `).join('')}
      </div>
    </div>
  `;

  content.classList.remove('visible');
  void content.offsetWidth;
  content.classList.add('visible');
}

function updateBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  bc.innerHTML = breadcrumbPath.map((name, i) => {
    if (i === breadcrumbPath.length - 1) {
      return `<span class="current">${name}</span>`;
    }
    return `<span onclick="navigateTo(${i})">${name}</span><span class="sep">/</span>`;
  }).join('');
}

init();
</script>
</body>
</html>
